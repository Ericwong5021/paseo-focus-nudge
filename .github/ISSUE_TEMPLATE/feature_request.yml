name: Feature request / 功能建议
description: Propose a capability or change to the default behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and alternatives / 期望行为与替代方案
    validations:
      required: true
